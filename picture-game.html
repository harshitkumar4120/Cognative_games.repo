<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Picture Recognition | MindCare AI</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            overflow-x: hidden;

            background:
                linear-gradient(
                    135deg,
                    #ff512f,
                    #dd2476,
                    #7f00ff,
                    #00c6ff
                );

            background-size: 400% 400%;

            animation: gradientMove 12s ease infinite;
        }


        /* Animated Background */

        @keyframes gradientMove {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }

        }


        /* Floating Bubbles */

        .bubble {
            position: fixed;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.15);

            z-index: -1;

            animation: floatBubble 8s infinite ease-in-out;
        }


        .bubble1 {
            width: 250px;
            height: 250px;

            top: -80px;
            left: -80px;
        }


        .bubble2 {
            width: 200px;
            height: 200px;

            bottom: -50px;
            right: -50px;

            animation-delay: 2s;
        }


        .bubble3 {
            width: 120px;
            height: 120px;

            top: 35%;
            left: 8%;

            animation-delay: 4s;
        }


        @keyframes floatBubble {

            50% {
                transform:
                    translateY(-30px)
                    translateX(25px);
            }

        }


        /* Main Container */

        .game-container {

            width: 100%;
            max-width: 750px;

            text-align: center;

            padding: 35px;

            border-radius: 30px;

            background: rgba(255, 255, 255, 0.18);

            backdrop-filter: blur(20px);

            border:
                1px solid
                rgba(255, 255, 255, 0.3);

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.25);
        }


        /* Heading */

        h1 {

            font-size: 38px;

            color: white;

            margin-bottom: 10px;

            text-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.2);
        }


        .description {

            color:
                rgba(255, 255, 255, 0.9);

            margin-bottom: 25px;

            font-size: 16px;
        }


        /* Stats */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-bottom: 25px;
        }


        .stat-box {

            background:
                rgba(255, 255, 255, 0.2);

            padding: 15px;

            border-radius: 15px;

            color: white;

            border:
                1px solid
                rgba(255, 255, 255, 0.25);
        }


        .stat-box h3 {

            font-size: 22px;

            margin-bottom: 5px;
        }


        .stat-box span {

            font-size: 12px;

            opacity: 0.85;
        }


        /* Question Card */

        .question-card {

            background:
                rgba(255, 255, 255, 0.15);

            padding: 30px;

            border-radius: 25px;

            border:
                1px solid
                rgba(255, 255, 255, 0.25);

            margin-bottom: 25px;
        }


        .question-card h2 {

            color: white;

            font-size: 20px;

            margin-bottom: 20px;
        }


        /* Picture */

        .picture {

            width: 170px;
            height: 170px;

            margin: 0 auto;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 100px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #d9e7ff
                );

            border-radius: 25px;

            box-shadow:
                0 15px 30px
                rgba(0, 0, 0, 0.2);

            animation: pictureFloat 3s infinite ease-in-out;
        }


        @keyframes pictureFloat {

            50% {
                transform:
                    translateY(-8px)
                    rotate(2deg);
            }

        }


        /* Options */

        .options {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;

            margin-top: 30px;
        }


        .option {

            padding: 16px;

            border: none;

            border-radius: 14px;

            cursor: pointer;

            font-size: 17px;

            font-weight: bold;

            color: white;

            background:
                rgba(255, 255, 255, 0.18);

            border:
                1px solid
                rgba(255, 255, 255, 0.25);

            transition: 0.3s;
        }


        .option:hover {

            transform:
                translateY(-4px);

            background:
                rgba(255, 255, 255, 0.28);
        }


        .option.correct {

            background:
                linear-gradient(
                    135deg,
                    #00b09b,
                    #96c93d
                );
        }


        .option.wrong {

            background:
                linear-gradient(
                    135deg,
                    #ff416c,
                    #ff4b2b
                );
        }


        /* Bottom */

        #message {

            min-height: 30px;

            color: white;

            font-size: 18px;

            font-weight: bold;

            margin-top: 15px;
        }


        .buttons {

            display: flex;

            justify-content: center;

            gap: 15px;

            margin-top: 20px;
        }


        #nextBtn {

            border: none;

            padding: 14px 25px;

            border-radius: 12px;

            cursor: pointer;

            font-size: 15px;

            font-weight: bold;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #ff512f,
                    #dd2476
                );

            box-shadow:
                0 8px 20px
                rgba(221, 36, 118, 0.35);

            display: none;

            transition: 0.3s;
        }


        #nextBtn:hover {

            transform:
                translateY(-3px);
        }


        /* Responsive */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .game-container {
                padding: 20px;
            }

            h1 {
                font-size: 28px;
            }

            .stats {
                gap: 8px;
            }

            .stat-box {
                padding: 10px;
            }

            .options {
                grid-template-columns: 1fr;
            }

            .picture {
                width: 140px;
                height: 140px;

                font-size: 80px;
            }

        }

    </style>

</head>


<body>


    <!-- Background Bubbles -->

    <div class="bubble bubble1"></div>
    <div class="bubble bubble2"></div>
    <div class="bubble bubble3"></div>


    <div class="game-container">


        <h1>👁️ Picture Recognition</h1>

        <p class="description">
            Look at the picture and choose the correct answer!
        </p>


        <!-- Stats -->

        <div class="stats">

            <div class="stat-box">

                <h3 id="questionNumber">1/5</h3>

                <span>Question</span>

            </div>


            <div class="stat-box">

                <h3 id="score">0</h3>

                <span>Correct Answers</span>

            </div>


            <div class="stat-box">

                <h3 id="timer">00:00</h3>

                <span>Time</span>

            </div>

        </div>


        <!-- Question -->

        <div class="question-card">

            <h2>What is this object?</h2>


            <div
                class="picture"
                id="picture"
            >
                🍎
            </div>


            <div
                class="options"
                id="options"
            ></div>

        </div>


        <!-- Message -->

        <div id="message"></div>


        <!-- Button -->

        <div class="buttons">

            <button
                id="nextBtn"
                onclick="nextQuestion()"
            >
                Next Question →
            </button>

        </div>


    </div>


    <script>


        /* ============================
           GAME QUESTIONS
        ============================ */

        const questions = [

            {
                emoji: "🍎",

                correct: "Apple",

                options: [
                    "Apple",
                    "Banana",
                    "Mango",
                    "Orange"
                ]
            },

            {
                emoji: "🐶",

                correct: "Dog",

                options: [
                    "Cat",
                    "Dog",
                    "Lion",
                    "Horse"
                ]
            },

            {
                emoji: "🚗",

                correct: "Car",

                options: [
                    "Bus",
                    "Car",
                    "Train",
                    "Bike"
                ]
            },

            {
                emoji: "🌙",

                correct: "Moon",

                options: [
                    "Sun",
                    "Star",
                    "Moon",
                    "Cloud"
                ]
            },

            {
                emoji: "🐘",

                correct: "Elephant",

                options: [
                    "Dog",
                    "Elephant",
                    "Horse",
                    "Lion"
                ]
            }

        ];


        let currentQuestion = 0;

        let correctAnswers = 0;

        let seconds = 0;

        let timerInterval;

        let answered = false;


        /* ============================
           ELEMENTS
        ============================ */

        const picture =
            document.getElementById("picture");

        const optionsContainer =
            document.getElementById("options");

        const questionNumber =
            document.getElementById("questionNumber");

        const scoreDisplay =
            document.getElementById("score");

        const message =
            document.getElementById("message");

        const nextBtn =
            document.getElementById("nextBtn");

        const timerDisplay =
            document.getElementById("timer");


        /* ============================
           LOAD QUESTION
        ============================ */

        function loadQuestion() {

            answered = false;

            nextBtn.style.display = "none";

            message.innerText = "";


            const question =
                questions[currentQuestion];


            picture.innerText =
                question.emoji;


            questionNumber.innerText =
                (currentQuestion + 1) +
                "/" +
                questions.length;


            optionsContainer.innerHTML = "";


            let shuffledOptions =
                [...question.options]
                .sort(() =>
                    Math.random() - 0.5
                );


            shuffledOptions.forEach(
                function(option) {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.classList.add(
                        "option"
                    );


                    button.innerText =
                        option;


                    button.addEventListener(
                        "click",
                        function() {

                            checkAnswer(
                                option,
                                button
                            );

                        }
                    );


                    optionsContainer.appendChild(
                        button
                    );

                }
            );

        }


        /* ============================
           CHECK ANSWER
        ============================ */

        function checkAnswer(
            selectedAnswer,
            selectedButton
        ) {

            if (answered) {

                return;

            }


            answered = true;


            const correctAnswer =
                questions[currentQuestion]
                .correct;


            const allButtons =
                document.querySelectorAll(
                    ".option"
                );


            allButtons.forEach(
                function(button) {

                    button.disabled = true;


                    if (
                        button.innerText ===
                        correctAnswer
                    ) {

                        button.classList.add(
                            "correct"
                        );

                    }

                }
            );


            if (
                selectedAnswer ===
                correctAnswer
            ) {

                correctAnswers++;


                scoreDisplay.innerText =
                    correctAnswers;


                message.innerText =
                    "🎉 Correct! Great recognition!";


            } else {

                selectedButton.classList.add(
                    "wrong"
                );


                message.innerText =
                    "❌ Not quite! The correct answer is " +
                    correctAnswer;

            }


            nextBtn.style.display =
                "inline-block";

        }


        /* ============================
           NEXT QUESTION
        ============================ */

        function nextQuestion() {

            currentQuestion++;


            if (
                currentQuestion <
                questions.length
            ) {

                loadQuestion();

            } else {

                endGame();

            }

        }


        /* ============================
           TIMER
        ============================ */

        function startTimer() {

            timerInterval =
                setInterval(function() {

                    seconds++;


                    let minutes =
                        Math.floor(seconds / 60);

                    let remainingSeconds =
                        seconds % 60;


                    minutes =
                        String(minutes)
                        .padStart(2, "0");


                    remainingSeconds =
                        String(remainingSeconds)
                        .padStart(2, "0");


                    timerDisplay.innerText =
                        minutes +
                        ":" +
                        remainingSeconds;

                }, 1000);

        }


        /* ============================
           END GAME
        ============================ */

        function endGame() {

            clearInterval(timerInterval);


            const percentage =
                Math.round(
                    (correctAnswers /
                    questions.length) * 100
                );


            picture.innerText = "🏆";

            optionsContainer.innerHTML = "";


            document
                .querySelector(
                    ".question-card h2"
                )
                .innerText =
                "Game Completed!";


            message.innerText =
                "🎉 Final Score: " +
                percentage +
                "%";


            nextBtn.style.display =
                "none";


            let analysis = "";


            if (percentage >= 80) {

                analysis =
                    "Excellent visual recognition performance!";

            } else if (percentage >= 60) {

                analysis =
                    "Good job! Keep practicing regularly.";

            } else {

                analysis =
                    "AI recommends more picture recognition practice.";
            }


            setTimeout(function() {

                alert(
                    "🏆 Game Completed!\n\n" +

                    "🎯 Correct Answers: " +
                    correctAnswers +
                    "/" +
                    questions.length +

                    "\n📊 Score: " +
                    percentage +
                    "%" +

                    "\n⏱️ Time: " +
                    timerDisplay.innerText +

                    "\n\n🤖 AI Analysis:\n" +
                    analysis
                );

            }, 500);

        }


        /* ============================
           START GAME
        ============================ */

        loadQuestion();

        startTimer();


    </script>


</body>

</html>
