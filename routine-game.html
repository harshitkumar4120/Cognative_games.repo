<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Routine Sequence | MindCare AI</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            overflow-x: hidden;

            background:
                linear-gradient(
                    135deg,
                    #11998e,
                    #38ef7d,
                    #667eea,
                    #764ba2
                );

            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;
        }


        /* Animated Background */

        @keyframes gradientMove {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }


        /* Floating Bubbles */

        .bubble {
            position: fixed;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            z-index: -1;
            animation: floatBubble 8s infinite ease-in-out;
        }


        .bubble1 {
            width: 260px;
            height: 260px;

            top: -100px;
            left: -80px;
        }


        .bubble2 {
            width: 200px;
            height: 200px;

            bottom: -60px;
            right: -50px;

            animation-delay: 2s;
        }


        .bubble3 {
            width: 130px;
            height: 130px;

            top: 40%;
            left: 8%;

            animation-delay: 4s;
        }


        @keyframes floatBubble {

            50% {
                transform:
                    translateY(-30px)
                    translateX(25px);
            }
        }


        /* Main Container */

        .game-container {
            width: 100%;
            max-width: 850px;

            text-align: center;

            padding: 35px;

            border-radius: 30px;

            background:
                rgba(255, 255, 255, 0.18);

            backdrop-filter: blur(20px);

            border:
                1px solid
                rgba(255, 255, 255, 0.3);

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.25);
        }


        /* Heading */

        h1 {
            font-size: 38px;
            color: white;

            margin-bottom: 10px;

            text-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.2);
        }


        .description {
            color:
                rgba(255, 255, 255, 0.9);

            margin-bottom: 25px;

            font-size: 16px;
        }


        /* Stats */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-bottom: 25px;
        }


        .stat-box {
            background:
                rgba(255, 255, 255, 0.2);

            padding: 15px;

            border-radius: 15px;

            color: white;

            border:
                1px solid
                rgba(255, 255, 255, 0.25);
        }


        .stat-box h3 {
            font-size: 22px;
            margin-bottom: 5px;
        }


        .stat-box span {
            font-size: 12px;
            opacity: 0.85;
        }


        /* Question Card */

        .question-card {
            background:
                rgba(255, 255, 255, 0.15);

            padding: 30px;

            border-radius: 25px;

            border:
                1px solid
                rgba(255, 255, 255, 0.25);
        }


        .question-card h2 {
            color: white;

            font-size: 22px;

            margin-bottom: 25px;
        }


        /* Instruction */

        .instruction {
            color: white;

            font-size: 16px;

            margin-bottom: 20px;

            opacity: 0.9;
        }


        /* Routine List */

        .routine-list {
            display: flex;

            flex-direction: column;

            gap: 12px;

            max-width: 550px;

            margin: auto;
        }


        .routine-item {
            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #e6f7ff
                );

            color: #333;

            padding: 18px 20px;

            border-radius: 15px;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            display: flex;

            align-items: center;

            gap: 15px;

            box-shadow:
                0 8px 20px
                rgba(0, 0, 0, 0.18);

            transition: 0.3s;

            user-select: none;
        }


        .routine-item:hover {
            transform:
                translateX(8px)
                scale(1.02);
        }


        .routine-item.dragging {
            opacity: 0.5;
            transform: scale(1.03);
        }


        .number {
            width: 35px;
            height: 35px;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            color: white;

            border-radius: 50%;

            font-size: 15px;
        }


        /* Buttons */

        .buttons {
            display: flex;

            justify-content: center;

            gap: 15px;

            margin-top: 25px;

            flex-wrap: wrap;
        }


        button {
            border: none;

            padding: 14px 22px;

            border-radius: 12px;

            cursor: pointer;

            font-size: 15px;

            font-weight: bold;

            color: white;

            transition: 0.3s;
        }


        #checkBtn {
            background:
                linear-gradient(
                    135deg,
                    #00b09b,
                    #96c93d
                );

            box-shadow:
                0 8px 20px
                rgba(0, 176, 155, 0.35);
        }


        #restartBtn {
            background:
                linear-gradient(
                    135deg,
                    #ff512f,
                    #dd2476
                );

            box-shadow:
                0 8px 20px
                rgba(221, 36, 118, 0.35);
        }


        button:hover {
            transform: translateY(-3px);
        }


        /* Message */

        #message {
            min-height: 35px;

            color: white;

            font-size: 18px;

            font-weight: bold;

            margin-top: 20px;
        }


        /* Responsive */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .game-container {
                padding: 20px;
            }

            h1 {
                font-size: 28px;
            }

            .stats {
                gap: 8px;
            }

            .stat-box {
                padding: 10px;
            }

            .routine-item {
                padding: 14px;

                font-size: 15px;
            }
        }

    </style>

</head>


<body>


    <!-- Background Bubbles -->

    <div class="bubble bubble1"></div>
    <div class="bubble bubble2"></div>
    <div class="bubble bubble3"></div>


    <!-- Main Game -->

    <div class="game-container">

        <h1>🧩 Daily Routine Sequencing</h1>

        <p class="description">
            Arrange the activities in the correct daily order!
        </p>


        <!-- Stats -->

        <div class="stats">

            <div class="stat-box">

                <h3 id="level">1</h3>

                <span>Level</span>

            </div>


            <div class="stat-box">

                <h3 id="score">0</h3>

                <span>Correct</span>

            </div>


            <div class="stat-box">

                <h3 id="timer">00:00</h3>

                <span>Time</span>

            </div>

        </div>


        <!-- Question -->

        <div class="question-card">

            <h2 id="routineTitle">
                Arrange the Morning Routine
            </h2>


            <p class="instruction">
                Drag and drop the activities into the correct order.
            </p>


            <div
                class="routine-list"
                id="routineList"
            ></div>

        </div>


        <!-- Buttons -->

        <div class="buttons">

            <button
                id="checkBtn"
                onclick="checkOrder()"
            >
                ✓ Check Answer
            </button>


            <button
                id="restartBtn"
                onclick="restartGame()"
            >
                🔄 Restart
            </button>

        </div>


        <!-- Message -->

        <div id="message"></div>


    </div>


    <script>


        /* ==========================
           GAME DATA
        ========================== */

        const levels = [

            {
                title:
                    "Arrange the Morning Routine",

                items: [
                    "🛏️ Wake Up",
                    "🪥 Brush Teeth",
                    "🍳 Eat Breakfast",
                    "👕 Get Dressed"
                ]
            },

            {
                title:
                    "Arrange the Evening Routine",

                items: [
                    "🍽️ Eat Dinner",
                    "📺 Relax",
                    "🪥 Brush Teeth",
                    "😴 Go to Sleep"
                ]
            },

            {
                title:
                    "Arrange the Going Out Routine",

                items: [
                    "🚿 Take a Bath",
                    "👕 Get Dressed",
                    "🎒 Take Your Essentials",
                    "🚪 Leave Home"
                ]
            }

        ];


        let currentLevel = 0;

        let correctLevels = 0;

        let seconds = 0;

        let timerInterval;

        let draggedItem = null;


        /* ==========================
           ELEMENTS
        ========================== */

        const routineList =
            document.getElementById("routineList");

        const levelDisplay =
            document.getElementById("level");

        const scoreDisplay =
            document.getElementById("score");

        const timerDisplay =
            document.getElementById("timer");

        const message =
            document.getElementById("message");

        const routineTitle =
            document.getElementById("routineTitle");


        /* ==========================
           SHUFFLE
        ========================== */

        function shuffle(array) {

            return [...array].sort(
                () =>
                Math.random() - 0.5
            );

        }


        /* ==========================
           LOAD LEVEL
        ========================== */

        function loadLevel() {

            message.innerText = "";


            const level =
                levels[currentLevel];


            levelDisplay.innerText =
                currentLevel + 1;


            routineTitle.innerText =
                level.title;


            routineList.innerHTML = "";


            const shuffledItems =
                shuffle(level.items);


            shuffledItems.forEach(
                function(item) {

                    const div =
                        document.createElement("div");


                    div.classList.add(
                        "routine-item"
                    );


                    div.draggable = true;


                    div.innerHTML =
                        "<div class='number'>☰</div>" +
                        "<span>" +
                        item +
                        "</span>";


                    /* Drag Start */

                    div.addEventListener(
                        "dragstart",
                        function() {

                            draggedItem = div;

                            div.classList.add(
                                "dragging"
                            );

                        }
                    );


                    /* Drag End */

                    div.addEventListener(
                        "dragend",
                        function() {

                            div.classList.remove(
                                "dragging"
                            );

                        }
                    );


                    routineList.appendChild(div);

                }
            );

        }


        /* ==========================
           DRAG AND DROP
        ========================== */

        routineList.addEventListener(
            "dragover",
            function(event) {

                event.preventDefault();


                const afterElement =
                    getDragAfterElement(
                        routineList,
                        event.clientY
                    );


                if (
                    afterElement == null
                ) {

                    routineList.appendChild(
                        draggedItem
                    );

                } else {

                    routineList.insertBefore(
                        draggedItem,
                        afterElement
                    );

                }

            }
        );


        function getDragAfterElement(
            container,
            y
        ) {

            const draggableElements =
                [
                    ...container.querySelectorAll(
                        ".routine-item:not(.dragging)"
                    )
                ];


            return draggableElements.reduce(
                function(
                    closest,
                    child
                ) {

                    const box =
                        child.getBoundingClientRect();


                    const offset =
                        y -
                        box.top -
                        box.height / 2;


                    if (
                        offset < 0 &&
                        offset > closest.offset
                    ) {

                        return {
                            offset: offset,
                            element: child
                        };

                    } else {

                        return closest;

                    }

                },

                {
                    offset:
                        Number.NEGATIVE_INFINITY
                }

            ).element;

        }


        /* ==========================
           CHECK ORDER
        ========================== */

        function checkOrder() {

            const currentItems =
                document.querySelectorAll(
                    ".routine-item span"
                );


            let userOrder = [];


            currentItems.forEach(
                function(item) {

                    userOrder.push(
                        item.innerText
                    );

                }
            );


            const correctOrder =
                levels[currentLevel].items;


            let isCorrect =
                JSON.stringify(userOrder) ===
                JSON.stringify(correctOrder);


            if (isCorrect) {

                correctLevels++;

                scoreDisplay.innerText =
                    correctLevels;


                message.innerText =
                    "🎉 Excellent! Correct sequence!";


                setTimeout(
                    function() {

                        currentLevel++;


                        if (
                            currentLevel <
                            levels.length
                        ) {

                            loadLevel();

                        } else {

                            endGame();

                        }

                    },

                    1200
                );

            } else {

                message.innerText =
                    "❌ Not quite! Try arranging the activities again.";

            }

        }


        /* ==========================
           TIMER
        ========================== */

        function startTimer() {

            timerInterval =
                setInterval(
                    function() {

                        seconds++;


                        let minutes =
                            Math.floor(
                                seconds / 60
                            );


                        let remainingSeconds =
                            seconds % 60;


                        minutes =
                            String(minutes)
                            .padStart(
                                2,
                                "0"
                            );


                        remainingSeconds =
                            String(
                                remainingSeconds
                            )
                            .padStart(
                                2,
                                "0"
                            );


                        timerDisplay.innerText =
                            minutes +
                            ":" +
                            remainingSeconds;

                    },

                    1000
                );

        }


        /* ==========================
           GAME COMPLETE
        ========================== */

        function endGame() {

            clearInterval(timerInterval);


            const percentage =
                Math.round(
                    (
                        correctLevels /
                        levels.length
                    ) * 100
                );


            routineList.innerHTML =
                `
                <div class="routine-item">
                    <div class="number">🏆</div>
                    <span>
                        Game Completed!
                    </span>
                </div>
                `;


            routineTitle.innerText =
                "Great Work! 🎉";


            message.innerText =
                "Final Score: " +
                percentage +
                "%";


            let analysis = "";


            if (
                percentage >= 80
            ) {

                analysis =
                    "Excellent daily routine sequencing and cognitive planning!";

            } else if (
                percentage >= 60
            ) {

                analysis =
                    "Good performance! Continue practicing daily routines.";

            } else {

                analysis =
                    "AI recommends more sequencing and routine practice.";

            }


            setTimeout(
                function() {

                    alert(

                        "🏆 Game Completed!\n\n" +

                        "🧩 Correct Levels: " +
                        correctLevels +
                        "/" +
                        levels.length +

                        "\n📊 Score: " +
                        percentage +
                        "%" +

                        "\n⏱️ Time: " +
                        timerDisplay.innerText +

                        "\n\n🤖 AI Analysis:\n" +
                        analysis

                    );

                },

                500
            );

        }


        /* ==========================
           RESTART GAME
        ========================== */

        function restartGame() {

            clearInterval(
                timerInterval
            );


            currentLevel = 0;

            correctLevels = 0;

            seconds = 0;


            scoreDisplay.innerText =
                "0";


            timerDisplay.innerText =
                "00:00";


            message.innerText = "";


            loadLevel();

            startTimer();

        }


        /* ==========================
    START GAME
        ========================== */

        loadLevel();

        startTimer();


    </script>

</body>

</html>
